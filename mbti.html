  <style>

      --primary-hover: #4338ca;

    .card-badge {

      font-weight: 800;

    .question-text {

      color: var(--text-main);

      margin-bottom: 18px;

    .card-tag {

    /* [액션 버튼 그룹] */
    .button-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;

    .next-btn {
      width: 100%;

      border: none;
      padding: 16px 0;

<!-- 모달 디자인 스타일 -->
<style>

    <p>16가지 성격유형의 심리와 가치관을 탐색할 수 있는 무료 대화 카드입니다.</p>

  <!-- [자바스크립트 동작 로직] -->
  <script>
    // 상태 변수 정의
    let mbtiQuestions = [];
    let currentMbti = 'INTJ';
    let lastQuestionId = null;

    // DOM 요소 캐싱
    const badgeEl = document.getElementById('mbtiBadge');
    const questionEl = document.getElementById('questionText');
    const tagEl = document.getElementById('tagText');
    const nextBtn = document.getElementById('nextBtn');
    const copyBtn = document.getElementById('copyBtn');
    const cardEl = document.getElementById('questionCard');
    const mbtiButtons = document.querySelectorAll('.mbti-btn');

    // 1. mbti_questions.json 비동기 로딩
    async function loadMbtiQuestions() {
      try {
        const response = await fetch('./mbti_questions.json');
        if (!response.ok) throw new Error('파일 로딩 실패');
        mbtiQuestions = await response.json();
        showMbtiQuestion();
      } catch (err) {
        questionEl.textContent = '질문 데이터를 불러오지 못했습니다.';
        tagEl.textContent = 'mbti_questions.json 파일 위치를 확인하세요.';
        console.error(err);
      }
    }

    // 2. 현재 선택된 MBTI 질문 랜덤 추출 로직
    function showMbtiQuestion() {
      const pool = mbtiQuestions.filter(item => item.mbti === currentMbti);

      if (pool.length === 0) {
        questionEl.textContent = '해당 MBTI의 질문이 준비 중입니다.';
        tagEl.textContent = '#업데이트예정';
        return;
      }

      // 연속 동일 질문 방지
      let availablePool = pool;
      if (pool.length > 1 && lastQuestionId !== null) {
        availablePool = pool.filter(item => item.id !== lastQuestionId);
      }

      const randomIndex = Math.floor(Math.random() * availablePool.length);
      const selected = availablePool[randomIndex];
      lastQuestionId = selected.id;

      // 부드러운 전환 효과
      cardEl.style.opacity = '0';
      cardEl.style.transform = 'translateY(6px)';

      setTimeout(() => {
        badgeEl.textContent = selected.mbtiName;
        questionEl.textContent = selected.question;
        tagEl.textContent = selected.tag;
        cardEl.style.opacity = '1';
        cardEl.style.transform = 'translateY(0)';
      }, 150);
    }

    // 3. MBTI 버튼 클릭 이벤트 리스너
    mbtiButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        mbtiButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMbti = btn.getAttribute('data-mbti');
        showMbtiQuestion();
      });
    });

    // 4. 다음 질문 뽑기
    nextBtn.addEventListener('click', showMbtiQuestion);

    // 5. 모바일/PC 완벽 호환 클립보드 복사 로직
    copyBtn.addEventListener('click', async () => {
      const textToCopy = `[${badgeEl.textContent}]\n"${questionEl.textContent}"\n${tagEl.textContent}`;
      try {
        await navigator.clipboard.writeText(textToCopy);
        copyBtn.textContent = '✅ 복사 완료!';
        copyBtn.classList.add('copied');
      } catch (err) {
        // Fallback for older browsers
        const tempTextarea = document.createElement('textarea');
        tempTextarea.value = textToCopy;
        document.body.appendChild(tempTextarea);
        tempTextarea.select();
        document.execCommand('copy');
        document.body.removeChild(tempTextarea);
        copyBtn.textContent = '✅ 복사 완료!';
        copyBtn.classList.add('copied');
      }

      setTimeout(() => {
        copyBtn.textContent = '📋 질문 복사하기';
        copyBtn.classList.remove('copied');
      }, 2000);
    });

    // 데이터 로드 실행
    loadMbtiQuestions();
    // --- [MBTI 전체 질문 모아보기 모달 동작 로직] ---
  const allModal = document.getElementById('allQuestionsModal');
  const openModalBtn = document.getElementById('openAllModalBtn');
  const closeModalBtn = document.getElementById('closeAllModalBtn');
  const modalList = document.getElementById('modalQuestionList');
  const modalTabs = document.getElementById('modalFilterTabs');

  let modalSelectedMbti = currentMbti || 'INTJ';
  let modalFilteredQuestions = [];

  // 16개 MBTI 목록
  const mbtiList = [
    '전체',
    'INTJ', 'INTP', 'ENTJ', 'ENTP',
    'INFJ', 'INFP', 'ENFJ', 'ENFP',
    'ISTJ', 'ISFJ', 'ESTJ', 'ESFJ',
    'ISTP', 'ISFP', 'ESTP', 'ESFP'
  ];

  // 모달 열기 (현재 선택 중인 MBTI 유형 질문을 기본으로 표시)
  if (openModalBtn) {
    openModalBtn.addEventListener('click', () => {
      allModal.style.display = 'flex';
      modalSelectedMbti = currentMbti || '전체';
      renderModalMbtiTabs();
      window.filterModalQuestions(modalSelectedMbti);
    });
  }

  // 모달 닫기
  if (closeModalBtn) {
    closeModalBtn.addEventListener('click', () => {
      allModal.style.display = 'none';
    });
  }
  if (allModal) {
    allModal.addEventListener('click', (e) => {
      if (e.target === allModal) allModal.style.display = 'none';
    });
  }

  // 상단 MBTI 필터 탭 렌더링
  function renderModalMbtiTabs() {
    if (!modalTabs) return;
    modalTabs.innerHTML = mbtiList.map(type => `
      <button type="button" class="modal-filter-btn ${type === modalSelectedMbti ? 'active' : ''}" onclick="window.filterModalQuestions('${type}')">
        ${type}
      </button>
    `).join('');
  }

  // MBTI 유형별 질문 목록 필터링 및 렌더링
  window.filterModalQuestions = function(type) {
    modalSelectedMbti = type;
    renderModalMbtiTabs();

    if (!mbtiQuestions || mbtiQuestions.length === 0) {
      modalList.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 20px;">질문을 불러오는 중입니다...</div>';
      return;
    }

    modalFilteredQuestions = (type === '전체')
      ? mbtiQuestions
      : mbtiQuestions.filter(q => (q.mbti || q.category) === type);

    if (modalFilteredQuestions.length === 0) {
      modalList.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 20px;">해당 유형의 질문이 없습니다.</div>';
      return;
    }

    modalList.innerHTML = modalFilteredQuestions.map((q, index) => {
      const qText = q.question || q.text || '';
      const qMbti = q.mbti || q.category || type;
      const qTag = q.tag || q.tags || '';

      return `
        <div class="modal-q-card" onclick="window.selectMbtiModalCard(${index})">
          <div style="flex: 1; text-align: left;">
            <span style="font-size: 0.75rem; color: #4f46e5; font-weight: 700; background: #e0e7ff; padding: 2px 7px; border-radius: 6px;">${qMbti}</span>
            <div style="font-size: 0.95rem; color: #1e293b; font-weight: 500; margin-top: 6px; line-height: 1.4;">${qText}</div>
            <span style="font-size: 0.78rem; color: #64748b; margin-top: 4px; display: inline-block;">${qTag}</span>
          </div>
          <span style="font-size: 0.85rem; color: #6366f1; font-weight: 600; white-space: nowrap; padding-left: 8px;">선택 ➔</span>
        </div>
      `;
    }).join('');
  };

  // 모달 목록에서 질문 선택 시 메인 카드에 즉시 반영
  window.selectMbtiModalCard = function(index) {
    const selected = modalFilteredQuestions[index];
    if (!selected) return;

    const qText = selected.question || selected.text || '';
    const qMbti = selected.mbti || selected.category || currentMbti;
    const qTag = selected.tag || selected.tags || '';

    if (badgeEl) badgeEl.textContent = qMbti;
    if (questionEl) questionEl.textContent = qText;
    if (tagEl) tagEl.textContent = qTag;
    lastQuestionId = selected.id;

    // 선택한 질문의 MBTI 버튼도 메인 화면에서 활성화 동기화
    if (mbtiButtons && qMbti !== '전체') {
      currentMbti = qMbti;
      mbtiButtons.forEach(btn => {
        const btnMbti = btn.getAttribute('data-mbti') || btn.textContent.trim();
        btn.classList.toggle('active', btnMbti === qMbti);
      });
    }

    allModal.style.display = 'none';
  };
  </script>
</body>
</html>
