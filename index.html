  <style>
    /* [1. 전체 레이아웃 & 테마 스타일] */
    :root {
      --primary: #4f46e5;         /* 메인 포인트 인디고 색상 */
      --primary-hover: #4338ca;   /* 버튼 호버 색상 */

<style>

  /* 카테고리 탭: flex-shrink: 0으로 찌그러짐 완전 방지 & 스크롤바 숨김 */

  <!-- [6. 자바스크립트 동작 로직] -->
  <script>
    let allQuestions = [];
    let currentCategory = 'all';
    let lastQuestionId = null;

    const badgeEl = document.getElementById('categoryBadge');
    const questionEl = document.getElementById('questionText');
    const tagEl = document.getElementById('tagText');
    const nextBtn = document.getElementById('nextBtn');
    const copyBtn = document.getElementById('copyBtn');
    const cardEl = document.getElementById('questionCard');
    const tabButtons = document.querySelectorAll('.tab-btn');

    // 질문 데이터 및 새로 만든 이미지 게임 데이터 동시 로딩
    async function loadQuestions() {
      try {
        const [resQuestions, resImage] = await Promise.all([
          fetch('./questions.json'),
          fetch('./image_game.json')
        ]);

        if (!resQuestions.ok) {
          throw new Error('questions.json 파일을 찾을 수 없습니다.');
        }

        const questionsData = await resQuestions.json();
        let imageData = [];

        // 이미지 게임 파일이 정상적으로 있을 경우 질문 목록으로 변환
        if (resImage.ok) {
          const rawImage = await resImage.json();
          imageData = rawImage.map((text, idx) => ({
            id: 'img_' + (idx + 1),
            category: 'image',
            categoryName: '🎯 이미지 게임',
            question: text,
            tag: '#이미지게임 #지목토크'
          }));
        }

        allQuestions = [...questionsData, ...imageData];
        showRandomQuestion();
      } catch (error) {
        questionEl.textContent = '질문 데이터를 불러오는 데 실패했습니다.';
        tagEl.textContent = '데이터 파일이 같은 저장소에 있는지 확인해주세요.';
        console.error(error);
      }
    }

    // 선택된 카테고리에 맞는 질문 무작위 추출
    function showRandomQuestion() {
      // '전체'일 때는 일반 대화 질문만 출력하고, '이미지 게임' 탭을 누르면 50개 이미지 질문만 출력
      const pool = currentCategory === 'all'
        ? allQuestions.filter(item => item.category !== 'image')
        : allQuestions.filter(item => item.category === currentCategory);

      if (pool.length === 0) {
        questionEl.textContent = '해당 카테고리에 질문이 없습니다.';
        return;
      }

      let availablePool = pool;
      if (pool.length > 1 && lastQuestionId !== null) {
        availablePool = pool.filter(item => item.id !== lastQuestionId);
      }

      const randomIndex = Math.floor(Math.random() * availablePool.length);
      const selected = availablePool[randomIndex];
      lastQuestionId = selected.id;

      cardEl.style.opacity = '0';
      cardEl.style.transform = 'translateY(6px)';
      setTimeout(() => {
        badgeEl.textContent = selected.categoryName;
        questionEl.textContent = selected.question;
        tagEl.textContent = selected.tag;
        cardEl.style.opacity = '1';
        cardEl.style.transform = 'translateY(0)';
      }, 150);
    }

    // 카테고리 탭 클릭 이벤트
    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        tabButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        currentCategory = button.getAttribute('data-category');
        showRandomQuestion();
      });
    });

    // 질문 뽑기 버튼
    nextBtn.addEventListener('click', showRandomQuestion);

    // 질문 복사하기 버튼
    const COPY_LABEL = '📋 질문 복사하기';
    let copyTimer = null;

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    }

    copyBtn.addEventListener('click', async () => {
      if (allQuestions.length === 0) return;
      const text = questionEl.textContent.trim() + '\n' + tagEl.textContent.trim();
      await copyText(text);

      copyBtn.textContent = '✅ 복사 완료!';
      copyBtn.classList.add('copied');
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => {
        copyBtn.textContent = COPY_LABEL;
        copyBtn.classList.remove('copied');
      }, 2000);
    });

    loadQuestions();
    // --- [전체 질문 모아보기 모달 동작 로직] ---
  const allModal = document.getElementById('allQuestionsModal');
  const openModalBtn = document.getElementById('openAllModalBtn');
  const closeModalBtn = document.getElementById('closeAllModalBtn');
  const modalList = document.getElementById('modalQuestionList');
  const modalTabs = document.getElementById('modalFilterTabs');

  let modalSelectedCategory = '전체';
  let modalFilteredQuestions = [];

  // 모달 열기
  if (openModalBtn) {
    openModalBtn.addEventListener('click', () => {
      allModal.style.display = 'flex';
      renderModalCategoryTabs();
      renderModalQuestions('전체');
    });
  }

  // 모달 닫기 (✕ 버튼 및 어두운 배경 클릭 시)
  if (closeModalBtn) {
    closeModalBtn.addEventListener('click', () => {
      allModal.style.display = 'none';
    });
  }
  if (allModal) {
    allModal.addEventListener('click', (e) => {
      if (e.target === allModal) allModal.style.display = 'none';
    });
  }

  // 카테고리 필터 탭 렌더링
  function renderModalCategoryTabs() {
    if (!modalTabs || !allQuestions.length) return;
    const catSet = new Set(allQuestions.map(q => q.categoryName || q.category));
    const categories = ['전체', ...Array.from(catSet)];

    modalTabs.innerHTML = categories.map(cat => `
      <button type="button" class="modal-filter-btn ${cat === modalSelectedCategory ? 'active' : ''}" onclick="window.filterModalQuestions('${cat}')">
        ${cat}
      </button>
    `).join('');
  }

  // 질문 목록 렌더링
  window.filterModalQuestions = function(category) {
    modalSelectedCategory = category;
    renderModalCategoryTabs();

    modalFilteredQuestions = (category === '전체') 
      ? allQuestions 
      : allQuestions.filter(q => (q.categoryName || q.category) === category);

    if (modalFilteredQuestions.length === 0) {
      modalList.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 20px;">질문이 없습니다.</div>';
      return;
    }

    modalList.innerHTML = modalFilteredQuestions.map((q, index) => `
      <div class="modal-q-card" onclick="window.selectModalCard(${index})">
        <div style="flex: 1; text-align: left;">
          <span style="font-size: 0.75rem; color: #4f46e5; font-weight: 700; background: #e0e7ff; padding: 2px 7px; border-radius: 6px;">${q.categoryName || '질문'}</span>
          <div style="font-size: 0.95rem; color: #1e293b; font-weight: 500; margin-top: 6px; line-height: 1.4;">${q.question}</div>
          <span style="font-size: 0.78rem; color: #64748b; margin-top: 4px; display: inline-block;">${q.tag || ''}</span>
        </div>
        <span style="font-size: 0.85rem; color: #6366f1; font-weight: 600; white-space: nowrap; padding-left: 8px;">선택 ➔</span>
      </div>
    `).join('');
  };

  // 목록에서 특정 질문 클릭 시 메인 카드에 즉시 적용
  window.selectModalCard = function(index) {
    const selected = modalFilteredQuestions[index];
    if (!selected) return;

    if (badgeEl) badgeEl.textContent = selected.categoryName || '카테고리';
    if (questionEl) questionEl.textContent = selected.question;
    if (tagEl) tagEl.textContent = selected.tag || '';
    lastQuestionId = selected.id;

    allModal.style.display = 'none';
  };
// --- [상단 🎯 이미지 게임 탭 동작 및 중간 바 자동 생성 로직] ---
  const navImageBtn = document.getElementById('navImageBtn');
  const navTalkBtn = document.getElementById('navTalkBtn');
  const categoryTabsContainer = document.querySelector('.category-tabs');
  const nextBtnEl = document.getElementById('nextBtn');

  if (navImageBtn && categoryTabsContainer) {
    navImageBtn.addEventListener('click', () => {
      // 1. 상단 메뉴 불빛 전환
      if (navTalkBtn) navTalkBtn.classList.remove('active');
      navImageBtn.classList.add('active');

      // 2. 중간 카테고리 탭들의 기존 선택 해제
      const existingTabBtns = categoryTabsContainer.querySelectorAll('.tab-btn');
      existingTabBtns.forEach(b => b.classList.remove('active'));

      // 3. 중간 바에 '🎯 이미지 게임' 탭이 없으면 생성, 있으면 활성화
      let dynamicTab = document.getElementById('dynamicImageTab');
      if (!dynamicTab) {
        dynamicTab = document.createElement('button');
        dynamicTab.id = 'dynamicImageTab';
        dynamicTab.className = 'tab-btn active';
        dynamicTab.type = 'button';
        dynamicTab.textContent = '🎯 이미지 게임';
        dynamicTab.setAttribute('data-category', 'image');
        categoryTabsContainer.appendChild(dynamicTab);
      } else {
        dynamicTab.classList.add('active');
        dynamicTab.style.display = 'inline-block';
      }

      // 4. 카테고리를 이미지 게임으로 전환하고 질문 즉시 뽑기 실행
      currentCategory = 'image';
      if (nextBtnEl) {
        nextBtnEl.click(); // '다른 질문 뽑기' 버튼 자동 클릭
      }
    });

    // 5. 중간 바의 다른 카테고리(전체, 소개팅 등)를 누르면 이미지 게임 탭 제거 및 상단 원복
    categoryTabsContainer.addEventListener('click', (e) => {
      const clickedBtn = e.target.closest('.tab-btn');
      if (!clickedBtn || clickedBtn.id === 'dynamicImageTab') return;

      navImageBtn.classList.remove('active');
      if (navTalkBtn) navTalkBtn.classList.add('active');

      const dynamicTab = document.getElementById('dynamicImageTab');
      if (dynamicTab) {
        dynamicTab.remove(); // 중간 바에서 이미지 게임 탭 자동 제거
      }
    });
  }
  </script>
</body>
</html>
